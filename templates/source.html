<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>{{file_name}} Source | ION SecOps Extension Analyzer</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static',filename='css/secops.css') }}?v=20260404">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static',filename='css/style.css') }}?v=20260404">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static',filename='css/bttn.css') }}?v=20260404">
    <link href="{{ url_for('static',filename='images/favicon.png') }}" rel="icon" />
    <link rel="stylesheet" href="{{ url_for('static',filename='css/codemirror.css') }}">
    <link rel="stylesheet" href="{{ url_for('static',filename='css/material.css') }}">
    <script type="text/javascript" src="{{ url_for('static',filename='js/fontawesome.min.js') }}"></script>
    <link href="{{ url_for('static',filename='css/fontawesome.min.css') }}" rel="stylesheet" type="text/css" />
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=DM+Sans:wght@400;500;600&display=swap"
        rel="stylesheet">
    <style>
        @font-face {
            font-family: "ocraextended";
            src:url("{{ url_for('static',filename='fonts/ocraextended.ttf') }}") format('truetype');
            font-weight: 400;
            font-style: normal;
        }

        @font-face {
            font-family: "Roboto";
            src:url("{{ url_for('static',filename='fonts/Roboto-Regular.ttf') }}") format('truetype');
            font-weight: 400;
            font-style: normal;
        }

        @font-face {
            font-family: "Roboto";
            src:url("{{ url_for('static',filename='fonts/Roboto-Italic.ttf') }}") format('truetype');
            font-weight: 400;
            font-style: italic;
        }

        @font-face {
            font-family: "Roboto";
            src:url("{{ url_for('static',filename='fonts/Roboto-Bold.ttf') }}") format('truetype');
            font-weight: 700;
            font-style: normal;
        }

        @keyframes fadeDown {
            from {
                opacity: 0;
                transform: translateY(-8px)
            }

            to {
                opacity: 1;
                transform: translateY(0)
            }
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #070b11;
            --bg2: #0c1220;
            --card: #0f1929;
            --border: #1c2e45;
            --accent: #00d4aa;
            --accent2: #3b82f6;
            --text: #dde6f0;
            --muted: #4a6080;
            --mono: 'JetBrains Mono', monospace;
            --body: 'DM Sans', sans-serif;
        }

        html,
        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--body);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .noscript {
            display: none;
            position: fixed;
            inset: 0;
            background: var(--bg);
            z-index: 9999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1rem;
        }

        .noscript img {
            width: 60px;
            opacity: .5;
        }

        .wrapper {
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        /* LOGO BAR */
        .logo-placeholder {
            display: flex;
            align-items: center;
            gap: .75rem;
            padding: .9rem 1.5rem;
            border-bottom: 1px solid var(--border);
            background: var(--bg);
            flex-shrink: 0;
        }

        .logo-placeholder::before {
            content: '';
            display: block;
            width: 4px;
            height: 30px;
            background: linear-gradient(180deg, var(--accent), var(--accent2));
            border-radius: 3px;
            flex-shrink: 0;
        }

        .logo-placeholder a {
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: .75rem;
        }

        .logo-text {
            font-family: var(--mono);
            font-size: .85rem;
            font-weight: 700;
            line-height: 1.3;
            color: var(--text);
            letter-spacing: .04em;
        }

        .logo-text span {
            color: var(--accent);
        }

        /* MAIN CONTAINER */
        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 0;
        }

        /* FILE INFO BAR */
        .file_info {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: .9rem 1.5rem;
            background: var(--card);
            border-bottom: 1px solid var(--border);
            animation: fadeDown .3s ease both;
            flex-wrap: wrap;
        }

        .file_image {
            width: 40px;
            height: 40px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1.1rem;
            color: var(--accent);
        }

        .file_image img {
            width: 28px;
            height: 28px;
            object-fit: contain;
        }

        .file_body {
            flex: 1;
            min-width: 0;
        }

        .file_name {
            font-family: var(--mono);
            font-size: .82rem;
            font-weight: 700;
            color: var(--text);
            letter-spacing: .02em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: .35rem;
        }

        .file_attrs {
            display: flex;
            flex-wrap: wrap;
            gap: .5rem 1.25rem;
        }

        .file_location,
        .file_type,
        .file_size {
            display: flex;
            align-items: center;
            gap: .35rem;
            font-family: var(--mono);
            font-size: .68rem;
            color: var(--muted);
            letter-spacing: .04em;
        }

        .file_icon {
            color: var(--accent2);
        }

        /* EDITOR AREA */
        .source_code {
            display: none;
        }

        .CodeMirror {
            flex: 1;
            height: calc(100vh - 140px);
            font-family: var(--mono) !important;
            font-size: .82rem;
        }

        /* EDITOR BUTTONS BAR */
        .editor_buttons {
            display: flex;
            gap: .5rem;
            padding: .7rem 1rem;
            background: var(--bg2);
            border-top: 1px solid var(--border);
            flex-shrink: 0;
        }

        .format_button {
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 5px;
            padding: .5rem 1rem;
            font-family: var(--mono);
            font-size: .7rem;
            font-weight: 600;
            letter-spacing: .06em;
            text-transform: uppercase;
            color: var(--muted);
            cursor: pointer;
            transition: background .2s, color .2s, border-color .2s;
            display: flex;
            align-items: center;
            gap: .4rem;
        }

        .format_button:hover {
            background: rgba(0, 212, 170, .08);
            border-color: var(--accent);
            color: var(--accent);
        }
    </style>
</head>

<body>
    <div class="noscript" id="noscript">
        <img src="{{ url_for('static',filename='images/error.png') }}">
        <h1 style="font-family:'JetBrains Mono',monospace;font-size:.85rem;color:#4a6080;">JavaScript required to run
            ION SecOps Extension Analyzer.</h1>
    </div>

    <div class="wrapper">
        <div class="logo-placeholder">
            <a href="/">
                <h1 class="logo-text">ION <span>SecOps</span> Extension Analyzer</h1>
            </a>
        </div>

        <div class="container" id="container">
            <div class="file_info">
                <div class="file_image">{{file_icon | safe}}</div>
                <div class="file_body">
                    <div class="file_name">Showing File: {{file_name}}</div>
                    <div class="file_attrs">
                        <div class="file_location">
                            <div class="file_icon"><i class="fas fa-folder"></i></div>
                            {{file_location}}
                        </div>
                        <div class="file_type">
                            <div class="file_icon"><i class="fas fa-file"></i></div>
                            {{file_type}} File
                        </div>
                        <div class="file_size">
                            <div class="file_icon"><i class="fas fa-weight"></i></div>
                            {{file_size}}
                        </div>
                    </div>
                </div>
            </div>

            <textarea class="source_code" id="editor">
                {{file_source}}
            </textarea>

            <div class="editor_buttons">
                <button class="format_button" onclick="formatSelection()"><i class="fas fa-hat-wizard"></i> Beautify
                    Selected</button>
                <button class="format_button" onclick="autoFormatSelection()"><i class="fas fa-magic"></i> Beautify Full
                    Code</button>
            </div>
        </div>
    </div>

    <script type="text/javascript" src="{{ url_for('static',filename='js/jquery.js') }}"></script>
    <script type="text/javascript" src="{{ url_for('static',filename='js/main.js') }}"></script>
    <script src="{{ url_for('static',filename='js/codemirror.js') }}"></script>
    <script src="{{ url_for('static',filename='js/javascript.js') }}"></script>
    <script src="{{ url_for('static',filename='js/htmlmixed.js') }}"></script>
    <script src="{{ url_for('static',filename='js/css.js') }}"></script>
    <script src="{{ url_for('static',filename='js/xml.js') }}"></script>
    <script src="{{ url_for('static',filename='js/beautify.js') }}"></script>
</body>
<script>
    code_mode = '{{file_type}}'
    if (code_mode === 'html') { code_type = 'htmlmixed' } else if (code_mode === 'json') { code_type = 'javascript' } else if (code_mode === 'css') { code_type = 'css' } else { code_type = 'javascript' }
    var codemirror = CodeMirror.fromTextArea(document.getElementById('editor'), {
        mode: code_type,
        theme: "material",
        lineNumbers: true,
        readOnly: false
    });

    function getSelectedRange() {
        return { from: codemirror.getCursor(true), to: codemirror.getCursor(false) };
    }
    function autoFormatSelection() {
        if (code_type === 'javascript') {
            var currentValue = codemirror.getValue();
            var newval = js_beautify(currentValue);
            codemirror.setValue(newval);
        }
        totalLines = codemirror.lineCount();
        codemirror.autoFormatRange({ line: 0, ch: 0 }, { line: totalLines });
    }
    function formatSelection() {
        var range = getSelectedRange();
        codemirror.autoFormatRange(range.from, range.to);
    }
    (function () {
        CodeMirror.extendMode("css", {
            commentStart: "/*", commentEnd: "*/",
            newlineAfterToken: function (type, content) { return /^[;{}]$/.test(content); }
        });
        CodeMirror.extendMode("javascript", {
            commentStart: "/*", commentEnd: "*/",
            newlineAfterToken: function (type, content, textAfter, state) {
                if (this.jsonMode) { return /^[\[,{]$/.test(content) || /^}/.test(textAfter); }
                else { if (content == ";" && state.lexical && state.lexical.type == ")") return false; return /^[;{}]$/.test(content) && !/^;/.test(textAfter); }
            }
        });
        CodeMirror.extendMode("xml", {
            commentStart: "<!--", commentEnd: "-->",
            newlineAfterToken: function (type, content, textAfter) { return type == "tag" && />$/.test(content) || /^</.test(textAfter); }
        });
        CodeMirror.defineExtension("commentRange", function (isComment, from, to) {
            var cm = this, curMode = CodeMirror.innerMode(cm.getMode(), cm.getTokenAt(from).state).mode;
            cm.operation(function () {
                if (isComment) {
                    cm.replaceRange(curMode.commentEnd, to);
                    cm.replaceRange(curMode.commentStart, from);
                    if (from.line == to.line && from.ch == to.ch)
                        cm.setCursor(from.line, from.ch + curMode.commentStart.length);
                } else {
                    var selText = cm.getRange(from, to);
                    var startIndex = selText.indexOf(curMode.commentStart);
                    var endIndex = selText.lastIndexOf(curMode.commentEnd);
                    if (startIndex > -1 && endIndex > -1 && endIndex > startIndex) {
                        selText = selText.substr(0, startIndex) + selText.substring(startIndex + curMode.commentStart.length, endIndex) + selText.substr(endIndex + curMode.commentEnd.length);
                    }
                    cm.replaceRange(selText, from, to);
                }
            });
        });
        CodeMirror.defineExtension("autoIndentRange", function (from, to) {
            var cmInstance = this;
            this.operation(function () { for (var i = from.line; i <= to.line; i++) { cmInstance.indentLine(i, "smart"); } });
        });
        CodeMirror.defineExtension("autoFormatRange", function (from, to) {
            var cm = this;
            var outer = cm.getMode(), text = cm.getRange(from, to).split("\n");
            var state = CodeMirror.copyState(outer, cm.getTokenAt(from).state);
            var tabSize = cm.getOption("tabSize");
            var out = "", lines = 0, atSol = from.ch == 0;
            function newline() { out += "\n"; atSol = true; ++lines; }
            for (var i = 0; i < text.length; ++i) {
                var stream = new CodeMirror.StringStream(text[i], tabSize);
                while (!stream.eol()) {
                    var inner = CodeMirror.innerMode(outer, state);
                    var style = outer.token(stream, state), cur = stream.current();
                    stream.start = stream.pos;
                    if (!atSol || /\S/.test(cur)) { out += cur; atSol = false; }
                    if (!atSol && inner.mode.newlineAfterToken && inner.mode.newlineAfterToken(style, cur, stream.string.slice(stream.pos) || text[i + 1] || "", inner.state)) newline();
                }
                if (!stream.pos && outer.blankLine) outer.blankLine(state);
                if (!atSol) newline();
            }
            cm.operation(function () {
                cm.replaceRange(out, from, to);
                for (var cur = from.line + 1, end = from.line + lines; cur <= end; ++cur) cm.indentLine(cur, "smart");
                cm.setSelection(from, cm.getCursor(false));
            });
        });
    })();
</script>

</html>
